
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>JuristeAI - Assistant JurisprudencesPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; height: 100vh; width: 100vw; }
      #root { height: 100%; width: 100%; }
      .font-arabic { font-family: 'Cairo', sans-serif; }
      .font-serif-legal { font-family: 'Playfair Display', serif; }
      @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .typing-dot { width: 4px; height: 4px; background: #64748b; border-radius: 50%; animation: typing 1s infinite ease-in-out; }
    </style>
    <script>
      // Protection contre les erreurs de process.env dans le navigateur
      window.process = { env: { API_KEY: "" } };
      // Capture d'erreurs pour le debug
      window.onerror = function(msg, url, line) {
        console.error("ERREUR DETECTEE: ", msg, " à ", url, " ligne ", line);
        return false;
      };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-markdown": "https://esm.sh/react-markdown@8.0.7",
    "@google/genai": "https://esm.sh/@google/genai@1.30.0",
    "mammoth": "https://esm.sh/mammoth@1.6.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
    <!-- Babel standalone est nécessaire pour transformer le JSX en JS à la volée sur Vercel sans compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex; justify-content:center; align-items:center; height:100vh; color:#64748b; font-family:sans-serif;">
        Chargement de l'assistant juridique...
      </div>
    </div>
    <script type="text/babel" data-type="module" src="./index.tsx"></script>
  </body>
</html>
