
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>JuristeAI - Assistant JurisprudencesPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: transparent;
      }
      .font-arabic { font-family: 'Cairo', sans-serif; }
      .font-serif-legal { font-family: 'Playfair Display', serif; }
      
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

      @keyframes typing {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .typing-dot {
        width: 4px; height: 4px; background: #64748b; border-radius: 50%;
        animation: typing 1s infinite ease-in-out;
      }
    </style>
    <script>
      // Simulation de l'objet process pour éviter les crashs navigateurs
      window.process = { env: { API_KEY: "" } };
      
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              legal: { 50: '#f0f4f8', 100: '#d9e2ec', 200: '#bcccdc', 500: '#627d98', 900: '#102a43' },
              gold: { 500: '#c5a028', 600: '#a68721' }
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "mammoth": "https://esm.sh/mammoth@1.6.0",
        "xlsx": "https://esm.sh/xlsx@0.18.5"
      }
    }
    </script>
  </head>
  <body class="h-screen overflow-hidden bg-slate-50">
    <div id="root" class="h-full"></div>
    <!-- LE POINT D'ENTRÉE MANQUANT -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
